<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Web Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My First Web Form</h1>

        <p>Please fill out the form below with your personal information.</p>

        <form action="https://jkorpela.fi/cgi-bin/echo.cgi" method="POST">

            <fieldset id="personal-information">

                <legend>Personal Information</legend>

                <label for="first-name">First Name:</label>
                <input
                    type="text"
                    id="first-name"
                    name="first-name"
                    placeholder="Enter your first name"
                    required>

                <label for="last-name">Last Name:</label>
                <input
                    type="text"
                    id="last-name"
                    name="last-name"
                    placeholder="Enter your last name"
                    required>

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required>

                <label for="phone">Phone Number:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required>

                <label for="birthday">Birthday:</label>
                <input
                    type="date"
                    id="birthday"
                    name="birthday"
                    required>

                <div class="buttons">
                    <button type="submit">Submit</button>
                </div>

            </fieldset>

        </form>

    </div>

</body>
</html>
